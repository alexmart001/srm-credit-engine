services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: srm_credit_engine
      MARIADB_USER: srm
      MARIADB_PASSWORD: srm
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: srm_credit_engine
      DB_USER: srm
      DB_PASSWORD: srm
      # Logging estruturado (JSON, formato Elastic Common Schema) - nativo do
      # Spring Boot 3.4+. Local/IDE continua em texto legivel (nao seta essa
      # env var); aqui simula o formato que um coletor de logs (ELK, Loki)
      # esperaria em producao.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # Explicito aqui (mesmo sendo o default) para documentar a relacao com
      # a porta do frontend abaixo - se voce mudar uma, mude a outra.
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080

volumes:
  mariadb_data:
