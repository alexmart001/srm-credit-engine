name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build, test, checkstyle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compile
        run: mvn -B compile

      # Golden cases (item 4.3 do desafio) rodam aqui, junto com os demais
      # testes unitarios e de integracao (SettlementService, concorrencia,
      # fluxo HTTP end-to-end).
      - name: Testes
        run: mvn -B test

      # Modo relatorio (nao falha o build) - ver comentario no pom.xml.
      - name: Checkstyle (relatorio)
        run: mvn -B checkstyle:checkstyle
        continue-on-error: true

      - name: Upload relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

      - name: Upload relatorio de checkstyle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: backend/target/checkstyle-result.xml

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build
