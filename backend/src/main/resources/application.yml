spring:
  application:
    name: srm-credit-engine
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:srm_credit_engine}
    username: ${DB_USER:srm}
    password: ${DB_PASSWORD:srm}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      # Flyway e a unica fonte de verdade do schema; Hibernate so valida.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

srm:
  cors:
    # Origem(ns) do frontend autorizadas a chamar esta API - separe por
    # vírgula se precisar de mais de uma (ex.: local + staging).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.srm.creditengine: INFO

# Resiliencia na integracao (mockada) de cambio - item 6 do desafio.
# O timeout e' implementado manualmente em ResilientFxRateGateway (ver
# javadoc da classe para o motivo); aqui configuramos apenas circuit
# breaker e retry, que sao anotacao-friendly no Resilience4j.
resilience4j:
  circuitbreaker:
    instances:
      fxProvider:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.srm.creditengine.exception.FxProviderUnavailableException
  retry:
    instances:
      fxProvider:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.srm.creditengine.exception.FxProviderUnavailableException
